version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_PATH: "/data/fittrack.db"
      CORS_ORIGIN: "http://localhost:8080"
    volumes:
      - fittrack-data:/data
    networks:
      - fittrack-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fittrack-frontend
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fittrack-net

volumes:
  fittrack-data:
    driver: local

networks:
  fittrack-net:
    driver: bridge
